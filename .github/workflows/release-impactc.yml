name: ImpactC Container Release

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: SHA complet ayant réussi le Quality Gate
        required: true
        type: string
      deploy_production:
        description: Déployer la release sur Contabo après publication GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: impactc-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: aquila04

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      deploy_production: ${{ steps.context.outputs.deploy_production }}
    steps:
      - id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || exit 0
            branch='${{ github.event.workflow_run.head_branch }}'
            sha='${{ github.event.workflow_run.head_sha }}'
            [[ "$branch" == "main" || "$branch" == prod/* ]] || exit 0
            deploy_production=false
            [[ "$branch" == prod/* ]] && deploy_production=true
          else
            sha='${{ inputs.ref }}'
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo "ref must be a full commit SHA" >&2; exit 1; }
            validated=$(gh api "repos/${{ github.repository }}/actions/workflows/quality.yml/runs?head_sha=${sha}&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // empty')
            [[ "$validated" == "$sha" ]] || { echo "the selected SHA has no successful Quality Gate" >&2; exit 1; }
            deploy_production='${{ inputs.deploy_production }}'
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy_production=$deploy_production" >> "$GITHUB_OUTPUT"

  build-api:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend-service
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/impactc-api:${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

  build-migrator:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend-service
          target: migrator
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/impactc-migrator:${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

  build-backoffice:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backoffice-web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=https://impactc-api.optimizesolux.com/api
            NEXT_PUBLIC_KEYCLOAK_BACKOFFICE_ENABLED=true
            NEXT_PUBLIC_KEYCLOAK_AUTHORITY=https://auth.optimizesolux.com/realms/impactc
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=impactc-backoffice
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/impactc-backoffice:${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

  deploy-production:
    needs: [prepare, build-api, build-migrator, build-backoffice]
    if: needs.prepare.outputs.deploy_production == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key and known hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_impactc
          chmod 0600 ~/.ssh/id_impactc
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Deploy immutable release on Contabo
        shell: bash
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_SSH_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_SSH_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          : "${CONTABO_HOST:?CONTABO_SSH_HOST is required}"
          : "${CONTABO_USER:?CONTABO_SSH_USER is required}"
          : "${GHCR_PULL_TOKEN:?GHCR_PULL_TOKEN is required}"
          export GIT_HTTP_EXTRAHEADER="Authorization: Basic $(printf 'x-access-token:%s' "$GHCR_PULL_TOKEN" | base64 -w0)"
          ssh -i ~/.ssh/id_impactc -o BatchMode=yes "$CONTABO_USER@$CONTABO_HOST" \
            "export IMPACTC_SOURCE_REF='$RELEASE_SHA' IMPACTC_REPOSITORY='https://github.com/AQUILA04/ImpactC.git' GIT_HTTP_EXTRAHEADER='$GIT_HTTP_EXTRAHEADER' GHCR_USERNAME='AQUILA04' GHCR_TOKEN='$GHCR_PULL_TOKEN'; \
             /opt/optimizesolux/impactc/source/deploy/init.sh || true; \
             mkdir -p /opt/optimizesolux/impactc/source; \
             if [ ! -d /opt/optimizesolux/impactc/source/.git ]; then git -c http.extraheader=\"\$GIT_HTTP_EXTRAHEADER\" clone --no-checkout \"\$IMPACTC_REPOSITORY\" /opt/optimizesolux/impactc/source; fi; \
             /opt/optimizesolux/impactc/source/deploy/init.sh; \
             /opt/optimizesolux/impactc/deploy/deploy.sh prod \
               ghcr.io/aquila04/impactc-api:'$RELEASE_SHA' \
               ghcr.io/aquila04/impactc-migrator:'$RELEASE_SHA' \
               ghcr.io/aquila04/impactc-backoffice:'$RELEASE_SHA'"
      - name: Remove ephemeral SSH material
        if: always()
        run: rm -f ~/.ssh/id_impactc ~/.ssh/known_hosts
