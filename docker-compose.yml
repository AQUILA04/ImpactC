services:
  db:
    image: postgres:18-alpine
    container_name: impactc_postgres
    restart: always
    environment:
      POSTGRES_DB: impactc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impactc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    container_name: impactc_redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data:
